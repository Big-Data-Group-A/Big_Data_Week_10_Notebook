        /* Dashboard heading */

        .dashboard {
            display: grid;

            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            min-width: 0;
        }

        /* Responsive layout for smaller screens */
        @media (max-width: 800px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
